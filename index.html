<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <meta name="theme-color" content="#0b0e14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>俄罗斯方块 · Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>俄罗斯方块 <span class="en hide-narrow">Tetris</span></h1>
    </header>

    <main class="main">
      <aside class="panel left-panel">
        <div class="stats-row">
          <div class="stat-card">
            <div class="stat-label">分数 <span class="en hide-narrow">/ Score</span></div>
            <div class="stat-value" id="score">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">等级 <span class="en hide-narrow">/ Level</span></div>
            <div class="stat-value" id="level">1</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">消行 <span class="en hide-narrow">/ Lines</span></div>
            <div class="stat-value" id="lines">0</div>
          </div>
        </div>
        <div class="help help-desktop" aria-label="键盘操作">
          <h3>操作 / Controls</h3>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd> 左右移动</li>
            <li><kbd>↓</kbd> / <kbd>S</kbd> 软降</li>
            <li><kbd>↑</kbd> / <kbd>X</kbd> / <kbd>W</kbd> 顺时针旋转</li>
            <li><kbd>Z</kbd> 逆时针旋转</li>
            <li><kbd>Space</kbd> 硬降</li>
            <li><kbd>P</kbd> 暂停</li>
            <li><kbd>R</kbd> 重新开始</li>
          </ul>
        </div>
      </aside>

      <section class="board-column">
        <div class="board-wrap">
          <canvas id="board" width="300" height="600" aria-label="游戏板"></canvas>
          <div id="overlay" class="overlay hidden">
            <div class="overlay-card">
              <h2 id="overlay-title">暂停</h2>
              <p id="overlay-msg">按 P 继续</p>
              <button type="button" id="btn-restart" class="btn">重新开始</button>
            </div>
          </div>
        </div>

        <div class="control-pad-wrap">
          <div class="pad-toolbar">
            <button type="button" id="btn-edit-layout" class="pad-tool-btn" aria-pressed="false">编辑布局</button>
            <button type="button" id="btn-reset-layout" class="pad-tool-btn pad-tool-muted">重置布局</button>
          </div>
          <div class="control-pad" id="control-pad" aria-label="触控操作">
            <button type="button" class="pad-btn" data-action="ccw" aria-label="逆旋">逆旋</button>
            <button type="button" class="pad-btn" data-action="cw" aria-label="顺旋">顺旋</button>
            <button type="button" class="pad-btn pad-hard" data-action="hard" aria-label="硬降">硬降</button>
            <button type="button" class="pad-btn" data-action="left" data-repeat="1" aria-label="左移">←</button>
            <button type="button" class="pad-btn" data-action="down" data-repeat="1" aria-label="软降">↓</button>
            <button type="button" class="pad-btn" data-action="right" data-repeat="1" aria-label="右移">→</button>
          </div>
        </div>
      </section>

      <aside class="panel right-panel">
        <div class="stat-card next-card">
          <div class="stat-label">下一个 <span class="en hide-narrow">/ Next</span></div>
          <canvas id="next" width="120" height="120"></canvas>
        </div>
        <div class="action-btns">
          <button type="button" id="btn-pause" class="btn btn-secondary">暂停</button>
          <button type="button" id="btn-restart-side" class="btn">重新开始</button>
        </div>
      </aside>

      <details class="help help-mobile">
        <summary>操作提示</summary>
        <p class="touch-tip">使用触控板：左右移动、旋转、软降、硬降。可「编辑布局」拖动按钮。电脑可用键盘。</p>
      </details>
    </main>

    <footer class="footer">
      Classic 10×20 · 七种方块 · 消行升级加速
    </footer>
  </div>
  <script src="game.js"></script>
</body>
</html>
